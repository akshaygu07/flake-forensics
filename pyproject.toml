[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flake-forensics"
version = "0.0.1"
description = "Diagnose why a pytest test is flaky, not just that it is."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pytest>=7.0",
    "freezegun>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
flake-forensics = "flake_forensics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flake_forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
